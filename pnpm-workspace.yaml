packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"
catalog:
  "@better-auth/drizzle-adapter": ^1.7.15
  "@better-auth/expo": ^1.7.15
  "@trpc/client": 11.22.1
  "@trpc/server": 11.22.1
  "@types/node": ^26.4.1
  "@types/pg": ^8.23.1
  auth: ^1.7.15
  better-auth: ^1.7.15
  drizzle-orm: 1.0.0-rc.5
  effect: 4.1.2
  eslint: ^10.14.0
  jiti: ^2.7.0
  pg: ^8.23.1
  prettier: 3.9.10
  typescript: ~6.0.3
  vitest: ^5.0.5
allowBuilds:
  "@parcel/watcher": false
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
  unrs-resolver: true
# Keeps pnpm from writing the lockfile's packageManagerDependencies document,
# because GitHub's dependency graph can't read a two-document lockfile
# (https://pnpm.io/lockfile, https://docs.github.com/en/code-security/dependabot/ecosystems-supported-by-dependabot/supported-ecosystems-and-repositories#pnpm).
pmOnFail: ignore

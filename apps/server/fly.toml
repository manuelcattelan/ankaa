app = "ankaa-server"
primary_region = "fra"

[build]
dockerfile = "Dockerfile"

[deploy]
release_command = "node packages/database/src/migrate-production.ts"
strategy = "rolling"

[env]
CLOSE_GRACE_DELAY_MILLISECONDS = "500"
NODE_ENV = "production"
SERVER_HOST = "0.0.0.0"
SERVER_PORT = "8080"

[http_service]
auto_stop_machines = "stop"
internal_port = 8080
min_machines_running = 0

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
path = "/health"
timeout = "5s"

[[vm]]
memory = "1gb"
size = "shared-cpu-1x"

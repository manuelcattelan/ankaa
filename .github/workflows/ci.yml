name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      - run: pnpm lint --continue
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm format
        if: ${{ !cancelled() }}
      - run: pnpm check-types --continue
        if: ${{ !cancelled() }}
      - run: pnpm --filter @ankaa/mobile exec expo install --check
        if: ${{ !cancelled() }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      - run: pnpm test --continue
